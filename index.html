<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenidos a nuestro espacio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="lock-card fade-in" style="margin-top: 22vh;">
    <span style="font-family: 'Amiri', serif; font-size: 2.2rem; color: var(--oro);">✦</span>
    <h2 style="font-style: italic; margin-bottom: 0.5rem; color: var(--azul-majorelle);">Un pequeño regalo</h2>
    <p style="font-size: 1.05rem; color: var(--terracota);">Para entrar, escribe debajo:</p>
    
    <input type="text" id="respuestaInput" placeholder="Escribe lo que más me gusta de ti...">
    <br>
    <button onclick="validarAcceso()">Entrar a la página</button>
  </div>

  <div class="modal-alert" id="mensajeModal">
    <h3 style="font-family: 'Amiri', serif; font-size: 1.8rem; color: var(--esmeralda); margin-bottom: 0.5rem;">Me gusta todo de ti</h3>
    <p style="font-style: italic; font-size: 1.1rem; color: var(--texto); margin-bottom: 1.5rem;">Gracias por entrar a tu regalo. Vamos a ver si te gusta.</p>
    <button onclick="irAlMenu()" style="background: var(--esmeralda); color: white; border: none; padding: 0.5rem 1.5rem; cursor: pointer; border-radius: 4px;">Entrar</button>
  </div>

  <script>
    function validarAcceso() {
      const resp = document.getElementById('respuestaInput').value.trim();
      if(resp !== "") {
        // Cualquier respuesta es válida según tu PDF y activa el modal
        document.getElementById('mensajeModal').style.display = 'block';
      } else {
        alert("Escribe algo mi amor ❤️");
      }
    }
    function irAlMenu() {
      window.location.href = 'menu.html';
    }
  </script>
</body>
</html>
